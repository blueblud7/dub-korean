# v* 태그를 푸시하면 macOS(Apple 칩 / Intel)와 Windows 설치 파일을 빌드한 뒤,
# 마지막 job 하나가 Release를 만들어 파일을 모두 올린다. (빌드 job이 각자 Release를 만들면 중복 초안이 생김)
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   args: '--mac --arm64', name: mac-arm64 }
          - { os: macos-15-intel, args: '--mac --x64',   name: mac-x64 }
          - { os: windows-latest, args: '--win --x64',   name: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, pattern: 'installer-*', merge-multiple: true }
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "DUB Korean ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
